            generic/564
            generic/571
            generic/591
            generic/598
            generic/604
            generic/609
            generic/611
            generic/650
            generic/040
            generic/041
            generic/061
            generic/062
            generic/311
          )

          for test_name in "${tests[@]}"; do
            test_log="$log_dir/${test_name//\//-}.log"
            echo "===== $test_name ($RESULT_TAG) =====" | tee "$test_log"
            set +e
            sudo ./check "$test_name" 2>&1 | tee -a "$test_log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            test_status="${pipeline_status[0]}"
            tee_status="${pipeline_status[1]}"
            if [ "$test_status" -eq 0 ] && [ "$tee_status" -eq 0 ]; then
              result=PASS
            else
              result=FAIL
              failed=1
            fi
            printf '%s %s (check=%s, tee=%s)\n' \
              "$result" "$test_name" "$test_status" "$tee_status" \
              | tee -a "$summary"
          done

          echo "===== $RESULT_TAG xfstests summary ====="
          cat "$summary"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$RESULT_TAG has one or more failed xfstests"
            exit 1
          fi

      - name: Upload xfstests logs (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-${{ matrix.name }}-results
          if-no-files-found: warn
          path: |
            xfstests-${{ matrix.name }}-summary.txt
            xfstests-${{ matrix.name }}-logs/
            exfat-testsuites/xfstests-exfat/results/
