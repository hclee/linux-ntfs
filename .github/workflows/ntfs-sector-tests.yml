name: NTFS sector-size xfstests

on:
  push:
    branches:
      - fix/4kn
  workflow_dispatch:

jobs:
  xfstests:
    name: generic/013 (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # NTFS sees the same 512-byte logical sector on 512n and 512e.
          - name: 512e
            sector_size: 512
          - name: 4kn
            sector_size: 4096

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            build-essential \
            fio \
            gawk \
            git \
            gzip \
            libacl1-dev \
            libaio-dev \
            libattr1-dev \
            libelf-dev \
            libgcrypt20-dev \
            libgdbm-dev \
            libnl-3-dev \
            libnl-genl-3-dev \
            libtool \
            libtool-bin \
            linux-headers-$(uname -r) \
            pkg-config \
            tar \
            uuid-dev \
            attr \
            wget \
            xfslibs-dev \
            xfsprogs
          sudo apt-get purge -y libntfs-3g89 ntfs-3g || true
          test -z "$(command -v mount.ntfs 2>/dev/null || true)"
          sudo useradd fsgqa
          sudo useradd 123456-fsgqa

      - name: Build and load NTFS module
        run: |
          make -j"$(nproc)"
          sudo rmmod ntfs 2>/dev/null || true
          sudo insmod ntfs.ko

      - name: Build NTFS userspace tools
        run: |
          git clone --depth=1 --branch=ntfs-next \
            https://github.com/ntfsprogs-plus/ntfsprogs-plus
          cd ntfsprogs-plus
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Build xfstests
        run: |
          git clone --depth=1 https://github.com/namjaejeon/exfat-testsuites
          cd exfat-testsuites
          tar xzf xfstests-exfat.tgz
          cd xfstests-exfat
          make -j"$(nproc)"

      - name: Run full xfstests on ${{ matrix.name }}
        env:
          SECTOR_SIZE: ${{ matrix.sector_size }}
          RESULT_TAG: ${{ matrix.name }}
        run: |
          set -euxo pipefail
          truncate -s 10G test.img
          truncate -s 10G scratch.img
          TEST_DEV=$(sudo losetup --find --show --sector-size "$SECTOR_SIZE" test.img)
          SCRATCH_DEV=$(sudo losetup --find --show --sector-size "$SECTOR_SIZE" scratch.img)
          cleanup() {
            sudo umount /mnt/test /mnt/scratch 2>/dev/null || true
            sudo losetup -d "$TEST_DEV" 2>/dev/null || true
            sudo losetup -d "$SCRATCH_DEV" 2>/dev/null || true
          }
          trap cleanup EXIT

          test "$(sudo blockdev --getss "$TEST_DEV")" = "$SECTOR_SIZE"
          test "$(sudo blockdev --getss "$SCRATCH_DEV")" = "$SECTOR_SIZE"
          sudo mkfs.ntfs -F -s "$SECTOR_SIZE" -c 4096 "$TEST_DEV"
          sudo mkfs.ntfs -F -s "$SECTOR_SIZE" -c 4096 "$SCRATCH_DEV"

          sudo mkdir -p /mnt/test /mnt/scratch
          cd exfat-testsuites/xfstests-exfat
          cp local.config.ntfs local.config
          {
            echo "export TEST_DEV=$TEST_DEV"
            echo "export SCRATCH_DEV=$SCRATCH_DEV"
            echo "export TEST_DIR=/mnt/test"
            echo "export SCRATCH_MNT=/mnt/scratch"
            echo "export FSTYP=ntfs"
          } >> local.config

          summary="$GITHUB_WORKSPACE/xfstests-${RESULT_TAG}-summary.txt"
          log_dir="$GITHUB_WORKSPACE/xfstests-${RESULT_TAG}-logs"
          mkdir -p "$log_dir"
          : > "$summary"
          failed=0
          tests=(
            generic/001
            generic/002
            generic/005
            generic/006
            generic/007
            generic/011
            generic/013
            generic/014
            generic/020
            generic/023
            generic/024
            generic/028
            generic/029
            generic/030
            generic/035
            generic/036
            generic/037
            generic/067
            generic/069
            generic/070
            generic/074
            generic/075
            generic/076
            generic/080
            generic/084
            generic/087
            generic/088
            generic/089
            generic/091
            generic/095
            generic/097
            generic/098
            generic/100
            generic/108
            generic/109
            generic/112
            generic/113
            generic/114
            generic/117
            generic/120
            generic/123
            generic/124
            generic/126
            generic/127
            generic/129
            generic/130
            generic/131
            generic/132
            generic/133
            generic/135
            generic/141
            generic/169
            generic/184
            generic/192
            generic/193
            generic/198
            generic/207
            generic/208
            generic/209
            generic/210
            generic/211
            generic/212
            generic/215
            generic/221
            generic/236
            generic/239
            generic/240
            generic/241
            generic/245
            generic/246
            generic/247
            generic/248
            generic/249
            generic/257
            generic/263
            generic/285
            generic/294
            generic/306
            generic/308
            generic/309
            generic/310
            generic/313
            generic/314
            generic/317
            generic/323
            generic/325
            generic/337
            generic/338
            generic/339
            generic/340
            generic/344
            generic/345
            generic/346
            generic/354
            generic/355
            generic/378
            generic/393
            generic/394
            generic/401
            generic/403
            generic/405
            generic/406
            generic/409
            generic/410
            generic/411
            generic/412
            generic/418
            generic/423
            generic/426
            generic/428
            generic/430
            generic/431
            generic/432
            generic/433
            generic/434
            generic/437
            generic/438
            generic/441
            generic/443
            generic/448
            generic/450
            generic/451
            generic/452
            generic/460
            generic/464
