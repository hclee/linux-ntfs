name: linux ntfs test CI

on:
  push:
    branches:
    - main
    - ntfs-next
  pull_request:
    branches:
    - main
    - ntfs-next
  workflow_dispatch:
    inputs:
      geometry:
        description: "Native 4Kn profile geometry"
        default: m1k
        required: true
        type: choice
        options:
        - m1k
        - m4k
      test_case:
        description: "Run one case five times, or all listed cases once"
        default: generic/013
        required: true
        type: string
      test_cases:
        description: "Comma-separated cases to run sequentially in one setup"
        required: false
        type: string
      test_repeats:
        description: "Number of repetitions for a selected test case"
        default: "5"
        required: true
        type: string
      check_timeout:
        description: "Per-test timeout in seconds; 0 disables the timeout"
        default: "300"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install package for kernel build
      run: |
        sudo lsb_release -a
        sudo uname -r
        sudo apt-get update
        sudo apt-get install -y libelf-dev python3 util-linux
        sudo apt-get remove -y libntfs-3g89 ntfs-3g || true
    - name: Prerequisite for xfstests testing
      run: |
        sudo apt-get install -y linux-headers-$(uname -r)
        sudo apt-get install -y autoconf libtool pkg-config libnl-3-dev libnl-genl-3-dev
        sudo apt-get install -y xfslibs-dev uuid-dev libtool-bin xfsprogs libgdbm-dev gawk fio attr libattr1-dev libacl1-dev libaio-dev
        sudo apt-get install -y libgcrypt20-dev
        git clone https://github.com/namjaejeon/exfat-testsuites
        git clone --depth=1 --branch=ntfs-next https://github.com/ntfsprogs-plus/ntfsprogs-plus
        test "$(git -C ntfsprogs-plus rev-parse HEAD)" = 346a3a7e57e7118441efeb93d5aeef7c8b0044c7
        git -C ntfsprogs-plus apply "$GITHUB_WORKSPACE/.github/patches/ntfsprogs-mft-record-size.patch"
        sudo useradd fsgqa 2>/dev/null || true
        sudo useradd 123456-fsgqa 2>/dev/null || true
    - name: Build and load NTFS module and userspace tools
      run: |
        set -o pipefail
        export PATH=/usr/local/bin:/usr/local/sbin:$PATH
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        make 2>&1 | tee host-module-build.log
        sudo make install 2>&1 | tee host-module-install.log
        sudo insmod ntfs.ko
        cd ntfsprogs-plus
        ./autogen.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-autogen.log"
        ./configure 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-configure.log"
        make -j$((`nproc`+1)) 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-build.log"
        sudo make install 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-install.log"
        cd "$GITHUB_WORKSPACE"
        mkntfs --help | grep -- --mft-record-size
        sudo mkdir -p /mnt/scratch /mnt/test
        mkdir -p ntfs-4kn-results
    - name: compressed read/write tests
      run: |
        sudo bash .github/scripts/run-compression-tests.sh
    - name: create file/director test
      env:
        GEOMETRY: ${{ github.event.inputs.geometry || 'm1k' }}
      run: |
        case "$GEOMETRY" in
          m1k) MFT_RECORD_SIZE=1024 ;;
          m4k) MFT_RECORD_SIZE=4096 ;;
          *) echo "GEOMETRY must be m1k or m4k" >&2; exit 2 ;;
        esac
        truncate -s 10G full_test.img
        loop=$(sudo losetup --find --show --sector-size 4096 full_test.img)
        trap 'sudo umount ./full_test/ 2>/dev/null || true; sudo losetup --detach "$loop" 2>/dev/null || true; rm -f full_test.img' EXIT
        sudo mkntfs -Q -s 4096 -c 4096 -r "$MFT_RECORD_SIZE" "$loop"
        mkdir -p full_test
        sudo mount -t ntfs "$loop" ./full_test/
        cd full_test/
        i=1; while [ $i -le 10000 ]; do sudo touch file$i; i=$(($i + 1)); done
        sync
        cd ..
        sudo umount ./full_test/
        sudo mount -t ntfs "$loop" ./full_test/
        cd full_test
        sudo rm -rf *
        i=1; while [ $i -le 10000 ]; do sudo mkdir file$i; i=$(($i + 1)); done
        sync
        sudo rm -rf *
        cd ..
        sudo umount ./full_test/
        sudo ntfsck -n "$loop"
    - name: native 4kn xfstests (one setup, sequential profile)
      env:
        GEOMETRY: ${{ github.event.inputs.geometry || 'm1k' }}
        TEST_CASES: ${{ github.event.inputs.test_cases || github.event.inputs.test_case || 'generic/013' }}
        TEST_REPEATS: ${{ github.event.inputs.test_repeats || '5' }}
        CHECK_TIMEOUT: ${{ github.event.inputs.check_timeout || '300' }}
      run: |
        export PATH=/usr/local/bin:/usr/local/sbin:$PATH
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        RESULTS_DIR="$GITHUB_WORKSPACE/ntfs-4kn-${GEOMETRY}-results" \
          bash .github/scripts/run-ntfs-4kn-xfstests.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ntfs-4kn-c4k-${{ github.event.inputs.geometry || 'm1k' }}-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          ntfs-4kn-*-results/
          exfat-testsuites/xfstests-exfat/results/
          host-module-build.log
          host-module-install.log
          ntfsprogs-*.log
