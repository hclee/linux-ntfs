name: linux ntfs test CI

on:
  push:
    branches:
    - main
    - ntfs-next
    - test-*
  pull_request:
    branches:
    - main
    - ntfs-next

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install xfstests dependencies
      run: |
        sudo lsb_release -a
        sudo uname -r
        sudo apt-get update
        sudo apt-get install tar gzip
        sudo apt-get remove libntfs-3g89 ntfs-3g
    - name: Prerequisite for xfstests testing
      run: |
        sudo apt-get install linux-headers-$(uname -r)
        sudo apt-get install autoconf libtool pkg-config libnl-3-dev libnl-genl-3-dev
        sudo apt-get install xfslibs-dev uuid-dev libtool-bin xfsprogs libgdbm-dev gawk fio attr libattr1-dev libacl1-dev libaio-dev
        sudo apt-get install libgcrypt20-dev
        git clone https://github.com/namjaejeon/exfat-testsuites
        git clone --branch=ntfs-next https://github.com/ntfsprogs-plus/ntfsprogs-plus
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        export PATH=/usr/local/lib:$PATH
        sudo useradd fsgqa
        sudo useradd 123456-fsgqa
    - name: Run xfstests testsuite
      run: |
        uname -r
        make > /dev/null
        sudo make install > /dev/null
        sudo insmod ntfs.ko
        cd ntfsprogs-plus
        ./autogen.sh > /dev/null
        ./configure > /dev/null
        make -j$((`nproc`+1)) > /dev/null
        sudo make install > /dev/null
        cd ..
        rm -rf ntfsprogs-plus
        sudo mkdir -p /mnt/scratch
        sudo mkdir -p /mnt/test
    - name: xfstest generic/650 regression
      if: always()
      run: |
        truncate -s 100G test.img
        truncate -s 100G scratch.img
        sudo losetup /dev/loop20 test.img
        sudo losetup /dev/loop21 scratch.img
        sudo mkfs.ntfs /dev/loop20
        sudo mkfs.ntfs /dev/loop21
        cd exfat-testsuites/
        tar xzvf xfstests-exfat.tgz > /dev/null
        rm xfstests-exfat.tgz
        cd xfstests-exfat
        cp local.config.ntfs local.config
        echo "" >> local.config
        echo 'MOUNT_OPTIONS="-osymlink=native,native_symlink=rel"' >> local.config
        make -j$((`nproc`+1)) > /dev/null
        echo 'FSTYP=ntfs' >> local.config
        ci_log_dir="$GITHUB_WORKSPACE/ci-generic-650"
        mkdir -p "$ci_log_dir"
        for iteration in $(seq 1 10); do
          started=$(date --iso-8601=seconds)
          echo "generic/650 repetition ${iteration}/10 started=${started}"
          if timeout --foreground --kill-after=30s 10m sudo ./check generic/650; then
            echo "generic/650 repetition ${iteration}/10 passed"
          else
            status=$?
            echo "generic/650 repetition ${iteration}/10 failed status=${status}"
            sudo sh -c 'echo w > /proc/sysrq-trigger' || true
            sudo sh -c 'echo t > /proc/sysrq-trigger' || true
            sudo dmesg --color=never > \
              "$ci_log_dir/generic-650-${iteration}.dmesg" || true
            ps -eLo pid,ppid,stat,wchan:32,comm,args > \
              "$ci_log_dir/generic-650-${iteration}.ps" || true
            exit "$status"
          fi
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
              name: xfs_results
              path: |
                /home/runner/work/linux-ntfs/linux-ntfs/exfat-testsuites/xfstests-exfat/results/generic/
                /home/runner/work/linux-ntfs/linux-ntfs/ci-generic-650/
