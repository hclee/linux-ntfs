name: linux ntfs test CI

on:
  push:
    branches:
    - main
    - ntfs-next
    - test-*
  pull_request:
    branches:
    - main
    - ntfs-next

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install package for kernel build
      run: |
        sudo lsb_release -a
        sudo uname -r
        sudo apt-get update
        sudo apt-get install libelf-dev wget tar gzip
        sudo apt-get remove libntfs-3g89 ntfs-3g
    - name: build test with 6.1 kernels
      run: |
        wget --no-check-certificate https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-6.1.161.tar.gz
        tar xf linux-6.1.161.tar.gz
        rm linux-6.1.161.tar.gz
        rm -rf linux-6.1.161/fs/ntfs/*
        mv linux-6.1.161 ../
        cp -ar * ../linux-6.1.161/fs/ntfs/
        cd ../linux-6.1.161/
        yes "" | make oldconfig > /dev/null
        echo 'CONFIG_NTFS_FS=m' >> .config
        make -j$((`nproc`+1)) KBUILD_MODPOST_WARN=1 KBUILD_MODPOST_NOFINAL=1 fs/ntfs/ntfs.ko
        cd ../linux-ntfs
        rm -rf ../linux-6.1.161/
    - name: build test with 6.6 kernels
      run: |
        wget --no-check-certificate https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-6.6.122.tar.gz
        tar xf linux-6.6.122.tar.gz
        rm linux-6.6.122.tar.gz
        rm -rf linux-6.6.122/fs/ntfs/*
        mv linux-6.6.122 ../
        cp -ar * ../linux-6.6.122/fs/ntfs/
        cd ../linux-6.6.122/
        yes "" | make oldconfig > /dev/null
        echo 'CONFIG_NTFS_FS=m' >> .config
        make -j$((`nproc`+1)) KBUILD_MODPOST_WARN=1 KBUILD_MODPOST_NOFINAL=1 fs/ntfs/ntfs.ko
        cd ../linux-ntfs
        rm -rf ../linux-6.6.122/
    - name: build test with 6.12 kernels
      run: |
        wget --no-check-certificate https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-6.12.68.tar.gz
        tar xf linux-6.12.68.tar.gz
        rm linux-6.12.68.tar.gz
        mkdir linux-6.12.68/fs/ntfs/
        mv linux-6.12.68 ../
        cp -ar * ../linux-6.12.68/fs/ntfs/
        cd ../linux-6.12.68/
        yes "" | make oldconfig > /dev/null
        sed -i '/source "fs\/fat\/Kconfig"/a source "fs\/ntfs\/Kconfig"' fs/Kconfig
        sed -i '/obj-\$(CONFIG_EXFAT_FS).*+= exfat\//i obj-$(CONFIG_NTFS_FS)       += ntfs/' fs/Makefile
        echo 'CONFIG_NTFS_FS=m' >> .config
        make -j$((`nproc`+1)) KBUILD_MODPOST_WARN=1 KBUILD_MODPOST_NOFINAL=1 fs/ntfs/ntfs.ko
        cd ../linux-ntfs
        rm -rf ../linux-6.12.68/
    - name: build test with 6.18 kernels
      run: |
        wget --no-check-certificate https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-6.18.22.tar.gz
        tar xf linux-6.18.22.tar.gz
        rm linux-6.18.22.tar.gz
        mkdir linux-6.18.22/fs/ntfs/
        mv linux-6.18.22 ../
        cp -ar * ../linux-6.18.22/fs/ntfs/
        cd ../linux-6.18.22/
        yes "" | make oldconfig > /dev/null
        sed -i '/source "fs\/fat\/Kconfig"/a source "fs\/ntfs\/Kconfig"' fs/Kconfig
        sed -i '/obj-\$(CONFIG_EXFAT_FS).*+= exfat\//i obj-$(CONFIG_NTFS_FS)       += ntfs/' fs/Makefile
        echo 'CONFIG_NTFS_FS=m' >> .config
        echo 'CONFIG_GENDWARFKSYMS=n' >> .config
        make -j$((`nproc`+1)) KBUILD_MODPOST_WARN=1 KBUILD_MODPOST_NOFINAL=1 fs/ntfs/ntfs.ko
        cd ../linux-ntfs
        rm -rf ../linux-6.18.22/
    - name: Prerequisite for xfstests testing
      run: |
        sudo apt-get install linux-headers-$(uname -r)
        sudo apt-get install autoconf libtool pkg-config libnl-3-dev libnl-genl-3-dev
        sudo apt-get install xfslibs-dev uuid-dev libtool-bin xfsprogs libgdbm-dev gawk fio attr libattr1-dev libacl1-dev libaio-dev
        sudo apt-get install libgcrypt20-dev
        git clone https://github.com/namjaejeon/exfat-testsuites
        git clone --branch=ntfs-next https://github.com/ntfsprogs-plus/ntfsprogs-plus
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        export PATH=/usr/local/lib:$PATH
        sudo useradd fsgqa
        sudo useradd 123456-fsgqa
    - name: Run xfstests testsuite
      run: |
        uname -r
        make > /dev/null
        sudo make install > /dev/null
        sudo insmod ntfs.ko
        cd ntfsprogs-plus
        ./autogen.sh > /dev/null
        ./configure > /dev/null
        make -j$((`nproc`+1)) > /dev/null
        sudo make install > /dev/null
        cd ..
        rm -rf ntfsprogs-plus
        sudo mkdir -p /mnt/scratch
        sudo mkdir -p /mnt/test
        sudo mkdir -p full_test
    - name: compressed read/write tests
      run: |
        sudo bash .github/scripts/run-compression-tests.sh
    - name: create file/director test
      run: |
        truncate -s 10G full_test.img
        sudo losetup /dev/loop22 full_test.img
        sudo mkfs.ntfs /dev/loop22
        sudo mount -t ntfs /dev/loop22 ./full_test/
        cd full_test/
        i=1;while [ $i -le 10000 ];do sudo touch file$i;if [ $? != 0 ]; then exit 1; fi; i=$(($i + 1));done
        sync
        cd ..
        sudo umount ./full_test/
        sudo mount -t ntfs /dev/loop22 ./full_test/
        cd full_test
        sudo rm -rf *
        i=1;while [ $i -le 10000 ];do sudo mkdir file$i;if [ $? != 0 ]; then exit 1; fi; i=$(($i + 1));done
        sync
        sudo rm -rf *
        cd ..
        sudo umount ./full_test/
        sudo ntfsck -n /dev/loop22
        rm full_test.img
    - name: xfstest generic/127 repeated 30 times
      if: always()
      run: |
        truncate -s 100G test.img
        truncate -s 100G scratch.img
        sudo losetup /dev/loop20 test.img
        sudo losetup /dev/loop21 scratch.img
        sudo mkfs.ntfs /dev/loop20
        sudo mkfs.ntfs /dev/loop21
        cd exfat-testsuites/
        tar xzvf xfstests-exfat.tgz > /dev/null
        rm xfstests-exfat.tgz
        cd xfstests-exfat
        cp local.config.ntfs local.config
        echo "" >> local.config
        echo 'MOUNT_OPTIONS="-osymlink=native,native_symlink=rel"' >> local.config
        make -j$((`nproc`+1)) > /dev/null
        echo 'FSTYP=ntfs' >> local.config
        i=1
        while [ $i -le 30 ]; do
          echo "Run generic/127 iteration $i"
          sudo ./check generic/127
          if [ $? != 0 ]; then
            exit 1
          fi
          i=$(($i + 1))
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
              name: xfs_results
              path: /home/runner/work/linux-ntfs/linux-ntfs/exfat-testsuites/xfstests-exfat/results/generic/
