name: linux ntfs test CI

on:
  push:
    branches:
    - main
    - ntfs-next
    - test-*
  pull_request:
    branches:
    - main
    - ntfs-next

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install packages for xfstests
      run: |
        sudo apt-get update
        sudo apt-get install libelf-dev autoconf libtool pkg-config \
          libnl-3-dev libnl-genl-3-dev xfslibs-dev uuid-dev libtool-bin \
          xfsprogs libgdbm-dev gawk fio attr libattr1-dev libacl1-dev \
          libaio-dev libgcrypt20-dev linux-headers-$(uname -r)
        sudo apt-get remove libntfs-3g89 ntfs-3g
    - name: prepare xfstests
      run: |
        git clone https://github.com/namjaejeon/exfat-testsuites
        git clone --branch=ntfs-next https://github.com/ntfsprogs-plus/ntfsprogs-plus
        sudo useradd fsgqa
        sudo useradd 123456-fsgqa
    - name: run generic/013 ten times
      run: |
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        export PATH=/usr/local/lib:$PATH
        make > /dev/null
        sudo make install > /dev/null
        sudo insmod ntfs.ko
        cd ntfsprogs-plus
        ./autogen.sh > /dev/null
        ./configure > /dev/null
        make -j$((`nproc`+1)) > /dev/null
        sudo make install > /dev/null
        cd ..
        rm -rf ntfsprogs-plus
        sudo mkdir -p /mnt/scratch /mnt/test
        truncate -s 100G test.img
        truncate -s 100G scratch.img
        sudo losetup /dev/loop20 test.img
        sudo losetup /dev/loop21 scratch.img
        trap 'sudo umount /mnt/test /mnt/scratch 2>/dev/null || true; sudo losetup -d /dev/loop20 /dev/loop21 2>/dev/null || true' EXIT
        sudo mkfs.ntfs /dev/loop20
        sudo mkfs.ntfs /dev/loop21
        cd exfat-testsuites/
        tar xzvf xfstests-exfat.tgz > /dev/null
        rm xfstests-exfat.tgz
        cd xfstests-exfat
        cp local.config.ntfs local.config
        echo "" >> local.config
        echo 'MOUNT_OPTIONS="-osymlink=native,native_symlink=rel"' >> local.config
        make -j$((`nproc`+1)) > /dev/null
        echo 'FSTYP=ntfs' >> local.config
        for attempt in $(seq 1 10); do
          echo "generic/013 run ${attempt}/10"
          sudo ./check generic/013
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: xfstests-generic-013-results
        path: /home/runner/work/linux-ntfs/linux-ntfs/exfat-testsuites/xfstests-exfat/results/generic/
