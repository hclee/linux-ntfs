name: linux ntfs test CI

on:
  push:
    branches:
    - main
    - ntfs-next
    - test-*
  pull_request:
    branches:
    - main
    - ntfs-next
  workflow_dispatch:
    inputs:
      test_case:
        description: "Run one generic case; blank runs all 160 cases"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install package for kernel build
      run: |
        sudo lsb_release -a
        sudo uname -r
        sudo apt-get update
        sudo apt-get install -y libelf-dev wget tar gzip python3 util-linux
        sudo apt-get remove -y libntfs-3g89 ntfs-3g || true
    # Native 4Kn is initially compiled only against the newest 6.17 kernel.
    # Older kernel build coverage is intentionally deferred until the 6.17 path is stable.
    - name: build port with newest 6.17.13 kernel
      run: |
        set -o pipefail
        exec > >(tee "$GITHUB_WORKSPACE/kernel-6.17.13-build.log") 2>&1
        wget --no-check-certificate https://mirrors.edge.kernel.org/pub/linux/kernel/v6.x/linux-6.17.13.tar.gz
        tar xf linux-6.17.13.tar.gz
        rm linux-6.17.13.tar.gz
        mkdir linux-6.17.13/fs/ntfs/
        mv linux-6.17.13 ../
        cp -ar * ../linux-6.17.13/fs/ntfs/
        cd ../linux-6.17.13/
        # oldconfig exits before yes can finish; keep the expected SIGPIPE
        # from making the pipefail-enabled logging step fail.
        set +o pipefail
        yes "" | make oldconfig > /dev/null
        set -o pipefail
        sed -i '/source "fs\/fat\/Kconfig"/a source "fs\/ntfs\/Kconfig"' fs/Kconfig
        sed -i '/obj-\$(CONFIG_EXFAT_FS).*+= exfat\//i obj-$(CONFIG_NTFS_FS)       += ntfs/' fs/Makefile
        echo 'CONFIG_NTFS_FS=m' >> .config
        echo 'CONFIG_GENDWARFKSYMS=n' >> .config
        make -j$((`nproc`+1)) KBUILD_MODPOST_WARN=1 fs/ntfs/ntfs.ko
        cp fs/ntfs/ntfs.ko "$GITHUB_WORKSPACE/ntfs-6.17.13.ko"
        cd "$GITHUB_WORKSPACE"
        rm -rf ../linux-6.17.13/
    - name: Prerequisite for xfstests testing
      run: |
        sudo apt-get install -y linux-headers-$(uname -r)
        sudo apt-get install -y autoconf libtool pkg-config libnl-3-dev libnl-genl-3-dev
        sudo apt-get install -y xfslibs-dev uuid-dev libtool-bin xfsprogs libgdbm-dev gawk fio attr libattr1-dev libacl1-dev libaio-dev
        sudo apt-get install -y libgcrypt20-dev
        git clone https://github.com/namjaejeon/exfat-testsuites
        git clone --depth=1 --branch=ntfs-next https://github.com/ntfsprogs-plus/ntfsprogs-plus
        test "$(git -C ntfsprogs-plus rev-parse HEAD)" = 346a3a7e57e7118441efeb93d5aeef7c8b0044c7
        git -C ntfsprogs-plus apply "$GITHUB_WORKSPACE/.github/patches/ntfsprogs-mft-record-size.patch"
        sudo useradd fsgqa 2>/dev/null || true
        sudo useradd 123456-fsgqa 2>/dev/null || true
    - name: Build and load NTFS module and userspace tools
      run: |
        set -o pipefail
        export PATH=/usr/local/bin:/usr/local/sbin:$PATH
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        make 2>&1 | tee host-module-build.log
        sudo make install 2>&1 | tee host-module-install.log
        sudo insmod ntfs.ko
        cd ntfsprogs-plus
        ./autogen.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-autogen.log"
        ./configure 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-configure.log"
        make -j$((`nproc`+1)) 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-build.log"
        sudo make install 2>&1 | tee "$GITHUB_WORKSPACE/ntfsprogs-install.log"
        cd "$GITHUB_WORKSPACE"
        /usr/local/bin/mkntfs --help | grep -- --mft-record-size
        sudo mkdir -p /mnt/scratch /mnt/test
        mkdir -p ntfs-4kn-results
    - name: compressed read/write tests
      run: |
        sudo bash .github/scripts/run-compression-tests.sh
    - name: create file/director test
      run: |
        truncate -s 10G full_test.img
        loop=$(sudo losetup --find --show full_test.img)
        trap 'sudo umount ./full_test/ 2>/dev/null || true; sudo losetup --detach "$loop" 2>/dev/null || true; rm -f full_test.img' EXIT
        sudo mkfs.ntfs "$loop"
        sudo mount -t ntfs "$loop" ./full_test/
        cd full_test/
        i=1; while [ $i -le 10000 ]; do sudo touch file$i; i=$(($i + 1)); done
        sync
        cd ..
        sudo umount ./full_test/
        sudo mount -t ntfs "$loop" ./full_test/
        cd full_test
        sudo rm -rf *
        i=1; while [ $i -le 10000 ]; do sudo mkdir file$i; i=$(($i + 1)); done
        sync
        sudo rm -rf *
        cd ..
        sudo umount ./full_test/
        sudo ntfsck -n "$loop"
    - name: native 4kn-c4k-m1k xfstests
      if: always()
      env:
        TEST_CASE: ${{ github.event.inputs.test_case || '' }}
      run: |
        export PATH=/usr/local/bin:/usr/local/sbin:$PATH
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        bash .github/scripts/run-ntfs-4kn-xfstests.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ntfs-4kn-c4k-m1k-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          ntfs-4kn-results/
          exfat-testsuites/xfstests-exfat/results/
          kernel-6.17.13-build.log
          ntfs-6.17.13.ko
          host-module-build.log
          host-module-install.log
          ntfsprogs-*.log
