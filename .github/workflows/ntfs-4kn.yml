name: NTFS native 4Kn

on:
  push:
    branches:
      - ci/4kn-c4k-m1k
      - test-4kn-*
      - port/4kn-c4k-m1k-1to1
      - port/4kn-c4k-m1k-1to1-ci
  workflow_dispatch:
    inputs:
      test_case:
        description: "xfstests case to validate; blank selects the full profile"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  KERNEL_VERSION: 6.18.22
  NTFS_PROGS_REPOSITORY: hclee/ntfsprogs-plus
  NTFS_PROGS_REF: topic/mkfs-mft-record-size-clean
  NTFS_PROGS_SHA: 1c7d03669425f668e90f9c58a56e66ba34f9e131

jobs:
  geometry:
    name: "6.18.22 native 4Kn geometry"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out linux-ntfs
        uses: actions/checkout@v4

      - name: Install build and QEMU dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake bc bison build-essential busybox-static \
            cpio curl flex gzip libelf-dev libfuse-dev libgcrypt20-dev \
            libacl1-dev libaio-dev libattr1-dev libcap-dev libncurses-dev \
            xfslibs-dev \
            libssl-dev libtool libtool-bin pkg-config python3 gawk attr acl \
            fio xfsprogs libgdbm-dev \
            qemu-system-x86 qemu-utils rsync tar xz-utils uuid-dev \
            debootstrap

      - name: Prepare requested test selection
        env:
          REQUESTED_CASE: ${{ inputs.test_case }}
        run: |
          set -eux
          mkdir -p ci-results
          if [ -n "$REQUESTED_CASE" ]; then
            grep -Fx "$REQUESTED_CASE" .github/xfstests/ntfs-geometry-full.list
            printf '%s\n' "$REQUESTED_CASE" > ci-results/tests.list
          else
            cp .github/xfstests/ntfs-geometry-full.list ci-results/tests.list
          fi
          {
            printf 'test_case=%s\n' "$REQUESTED_CASE"
            printf 'kernel=%s\n' "$KERNEL_VERSION"
          } > ci-results/request.txt

      - name: Check out pinned ntfsprogs-plus
        run: |
          set -eux
          git clone --filter=blob:none --single-branch \
            --branch "$NTFS_PROGS_REF" \
            "https://github.com/${NTFS_PROGS_REPOSITORY}.git" ntfsprogs-plus
          git -C ntfsprogs-plus checkout --detach "$NTFS_PROGS_SHA"
          git -C ntfsprogs-plus rev-parse HEAD | tee ci-results/ntfsprogs-plus.sha

      - name: Build and verify mkntfs
        run: |
          set -euxo pipefail
          cd ntfsprogs-plus
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          cd "$GITHUB_WORKSPACE"
          MKNTFS="$GITHUB_WORKSPACE/ntfsprogs-plus/src/.libs/mkntfs"
          test -x "$MKNTFS"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ntfsprogs-plus/libntfs/.libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$MKNTFS" --help | tee ci-results/mkntfs-help.txt
          grep -F -- '--mft-record-size' ci-results/mkntfs-help.txt
          printf 'mkntfs=%s\n' "$GITHUB_WORKSPACE/$MKNTFS" >> "$GITHUB_ENV"

          truncate -s $((4096 * 32768)) ci-results/formatter.img
          "$MKNTFS" -F -Q -s 4096 -c 4096 -r 1024 \
            ci-results/formatter.img 32768 > ci-results/mkntfs.log 2>&1
          python3 - ci-results/formatter.img > ci-results/boot-geometry.txt <<'PY'
          import struct
          import sys

          with open(sys.argv[1], "rb", buffering=0) as stream:
              boot = stream.read(4096)
          sector = struct.unpack_from("<H", boot, 11)[0]
          cluster = sector * boot[13]
          encoding = struct.unpack_from("<b", boot, 64)[0]
          record = 1 << -encoding if encoding < 0 else cluster * encoding
          print(f"bytes_per_sector={sector}")
          print(f"cluster_size={cluster}")
          print(f"mft_record_size={record}")
          if (sector, cluster, record) != (4096, 4096, 1024):
              raise SystemExit("unexpected 4kn-c4k-m1k boot geometry")
          PY

      - name: Cache Linux 6.18.22 source
        uses: actions/cache@v4
        with:
          path: linux-6.18.22.tar.xz
          key: linux-${{ env.KERNEL_VERSION }}-${{ runner.arch }}

      - name: Download Linux 6.18.22
        run: |
          set -eux
          if [ ! -s linux-6.18.22.tar.xz ]; then
            curl --fail --location --retry 2 \
              --connect-timeout 20 --max-time 300 \
              "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz" \
              -o linux-6.18.22.tar.xz
          fi
          test -s linux-6.18.22.tar.xz
          tar -tf linux-6.18.22.tar.xz >/dev/null

      - name: Cache built 6.18.22 NTFS artifacts
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            ci-results/bzImage
            ci-results/kernel.config
            ci-results/ntfs.ko
          key: linux-${{ env.KERNEL_VERSION }}-ntfs-${{ runner.arch }}-${{ hashFiles('*.c', '*.h', 'Kconfig', 'Makefile') }}

      - name: Build 6.18.22 kernel and NTFS module
        run: |
          set -euxo pipefail
          tar -xf linux-6.18.22.tar.xz
          mkdir -p "linux-${KERNEL_VERSION}/fs/ntfs"
          git ls-files -z | tar --null --files-from=- -cf - \
            | tar -xf - -C "linux-${KERNEL_VERSION}/fs/ntfs"
          cd "linux-${KERNEL_VERSION}"
          grep -q '^source "fs/ntfs/Kconfig"' fs/Kconfig || \
            printf '\nsource "fs/ntfs/Kconfig"\n' >> fs/Kconfig
          grep -q '^obj-\$(CONFIG_NTFS_FS).*ntfs/' fs/Makefile || \
            printf '\nobj-$(CONFIG_NTFS_FS) += ntfs/\n' >> fs/Makefile
          if [ "${{ steps.kernel-cache.outputs.cache-hit }}" = true ]; then
            test -s "$GITHUB_WORKSPACE/ci-results/bzImage"
            test -s "$GITHUB_WORKSPACE/ci-results/kernel.config"
            test -s "$GITHUB_WORKSPACE/ci-results/ntfs.ko"
            exit 0
          fi
          make defconfig
          scripts/config --enable CONFIG_BLK_DEV_INITRD
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_VIRTIO
          scripts/config --enable CONFIG_VIRTIO_BLK
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_FS_POSIX_ACL
          scripts/config --enable CONFIG_FS_XATTR
          scripts/config --enable CONFIG_BLK_DEV_LOOP
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --module CONFIG_NTFS_FS
          make olddefconfig
          make -j"$(nproc)" bzImage fs/ntfs/ntfs.ko \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-results/kernel-build.log"
          cp .config "$GITHUB_WORKSPACE/ci-results/kernel.config"
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/ci-results/bzImage"
          cp fs/ntfs/ntfs.ko "$GITHUB_WORKSPACE/ci-results/ntfs.ko"

      - name: Build xfstests and guest userspace
        run: |
          set -euxo pipefail
          git clone --depth=1 https://github.com/namjaejeon/exfat-testsuites
          tar -xzf exfat-testsuites/xfstests-exfat.tgz
          cd xfstests-exfat
          make -j"$(nproc)"
          cd "$GITHUB_WORKSPACE"
          rm -rf xfstests-exfat/.git

      - name: Create NTFS xfstests initramfs
        run: |
          set -euxo pipefail
          rm -rf guest-root ci-results/ntfs-4kn-initramfs.cpio.gz
          sudo debootstrap --variant=minbase --components=main,universe \
            --include=bash,bc,busybox-static,coreutils,cpio,diffutils,e2fsprogs,findutils,gawk,grep,kmod,libaio1t64,libcap2-bin,perl,procps,psmisc,python3,sed,tar,util-linux,acl,attr,fio,xfsprogs,xz-utils \
            noble guest-root http://archive.ubuntu.com/ubuntu
          sudo mkdir -p \
            guest-root/lib/modules/$KERNEL_VERSION/extra \
            guest-root/opt/ntfsprogs/src/.libs \
            guest-root/opt/ntfsprogs/libntfs/.libs
          sudo install -m 0644 ci-results/kernel-build.log guest-root/etc/ntfs-kernel-build.log
          sudo install -m 0644 \
            ci-results/ntfs.ko \
            "guest-root/lib/modules/$KERNEL_VERSION/extra/ntfs.ko"
          sudo cp -a ntfsprogs-plus/src/.libs/. guest-root/opt/ntfsprogs/src/.libs/
          sudo cp -a ntfsprogs-plus/libntfs/.libs/. guest-root/opt/ntfsprogs/libntfs/.libs/
          sudo cp -a xfstests-exfat guest-root/opt/
          sudo install -m 0644 ci-results/tests.list guest-root/etc/ntfs-4kn-tests.list
          sudo install -m 0755 \
            .github/scripts/ntfs-4kn-xfstests-init \
            guest-root/sbin/ntfs-4kn-xfstests-init
          sudo ln -sf /opt/ntfsprogs/src/.libs/mkntfs guest-root/sbin/mkfs.ntfs
          sudo ln -sf /opt/ntfsprogs/src/.libs/ntfsck guest-root/sbin/ntfsck
          {
            find ntfsprogs-plus/src/.libs xfstests-exfat/src \
              -type f -perm /111 -print0 \
              | while IFS= read -r -d '' binary; do
                  ldd "$binary" 2>/dev/null || true
                done
          } | awk '/=> \// { print $3 } /^\// { print $1 }' \
            | grep '^/' | sort -u \
            | while IFS= read -r library; do
                sudo cp --parents "$library" guest-root
              done
          sudo sh -c \
            'cd guest-root && find . -print0 | cpio --null -o -H newc' \
            | gzip -9 > ci-results/ntfs-4kn-initramfs.cpio.gz
          truncate -s 512M ci-results/ntfs-4kn-results.img
          mkfs.ext4 -q -F -L NTFS_RESULTS ci-results/ntfs-4kn-results.img

      - name: Build geometry probe initramfs
        run: |
          set -eux
          rm -rf initramfs initramfs.cpio.gz
          mkdir -p initramfs/{bin,dev,proc,sys}
          BUSYBOX=$(command -v busybox)
          cp "$BUSYBOX" initramfs/bin/busybox
          for app in sh mount cat basename sleep poweroff; do
            ln -s busybox "initramfs/bin/$app"
          done
          cp .github/scripts/ntfs-4kn-init initramfs/init
          chmod 0755 initramfs/init
          (
            cd initramfs
            find . -print0 | cpio --null -o -H newc
          ) | gzip -9 > initramfs.cpio.gz

      - name: Boot QEMU and verify 4096/4096 devices
        run: |
          set -euxo pipefail
          mkdir -p ci-results
          qemu-system-x86_64 -version | tee ci-results/qemu-version.txt
          qemu-system-x86_64 -device virtio-blk-pci,help \
            > ci-results/virtio-blk-help.txt
          truncate -s 256M ci-results/qemu-test.img
          truncate -s 256M ci-results/qemu-scratch.img
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            qemu-system-x86_64 \
            -machine q35 \
            -m 512M \
            -no-reboot \
            -nographic \
            -serial mon:stdio \
            -kernel ci-results/bzImage \
            -initrd initramfs.cpio.gz \
            -append "console=ttyS0 rdinit=/init panic=-1" \
            -drive file=ci-results/qemu-test.img,if=none,format=raw,id=test \
            -device virtio-blk-pci,drive=test,logical_block_size=4096,physical_block_size=4096 \
            -drive file=ci-results/qemu-scratch.img,if=none,format=raw,id=scratch \
            -device virtio-blk-pci,drive=scratch,logical_block_size=4096,physical_block_size=4096 \
            > ci-results/qemu-console.log 2>&1
          qemu_rc=$?
          set -e
          grep -F 'NTFS_4KN_GEOMETRY_PASS' ci-results/qemu-console.log
          printf 'qemu_exit=%s\n' "$qemu_rc" >> ci-results/qemu-console.log

      - name: Run NTFS xfstests in 6.18.22 QEMU
        run: |
          set -euxo pipefail
          truncate -s 16G ci-results/xfstests-test.img
          truncate -s 16G ci-results/xfstests-scratch.img
          set +e
          timeout --signal=TERM --kill-after=30s 5400s \
            qemu-system-x86_64 \
            -machine q35 \
            -cpu max \
            -smp 2 \
            -m 2048M \
            -no-reboot \
            -nographic \
            -serial stdio \
            -kernel ci-results/bzImage \
            -initrd ci-results/ntfs-4kn-initramfs.cpio.gz \
            -append "console=ttyS0 rdinit=/sbin/ntfs-4kn-xfstests-init panic=-1" \
            -drive file=ci-results/xfstests-test.img,if=none,format=raw,id=test \
            -device virtio-blk-pci,drive=test,logical_block_size=4096,physical_block_size=4096 \
            -drive file=ci-results/xfstests-scratch.img,if=none,format=raw,id=scratch \
            -device virtio-blk-pci,drive=scratch,logical_block_size=4096,physical_block_size=4096 \
            -drive file=ci-results/ntfs-4kn-results.img,if=none,format=raw,id=results \
            -device virtio-blk-pci,drive=results \
            > ci-results/qemu-xfstests-console.log 2>&1
          qemu_rc=$?
          set -e
          printf 'qemu_exit=%s\n' "$qemu_rc" | tee ci-results/qemu-xfstests-exit.txt
          mkdir -p ci-results/xfstests ci-results/results-mount
          collect_rc=0
          sudo mount -o loop,ro,noload \
            ci-results/ntfs-4kn-results.img ci-results/results-mount || collect_rc=$?
          if [ "$collect_rc" -eq 0 ]; then
            sudo cp -a ci-results/results-mount/. ci-results/xfstests/
            sudo umount ci-results/results-mount
            sudo chown -R "$USER:$USER" ci-results/xfstests
          fi
          if [ -f ci-results/xfstests/status ]; then
            cat ci-results/xfstests/status
          else
            printf 'NTFS_XFSTESTS_FAIL: result disk was not collected\n' \
              | tee ci-results/xfstests/status
          fi
          find ci-results/xfstests -type f -name '*.out.bad' -printf '%f\n' \
            | sed 's/\.out\.bad$//' | sort -u \
            > ci-results/xfstests-failures.txt || true
          if grep -Eiq 'kernel panic|BUG:|Oops:|general protection fault' \
              ci-results/qemu-xfstests-console.log; then
            echo 'kernel_fault=yes' | tee ci-results/kernel-fault.txt
          else
            echo 'kernel_fault=no' | tee ci-results/kernel-fault.txt
          fi
          if [ "$qemu_rc" -ne 0 ] || ! grep -q '^NTFS_XFSTESTS_PASS$' \
              ci-results/xfstests/status; then
            exit 1
          fi

      - name: Upload native 4Kn setup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntfs-4kn-6.18.22-setup
          path: ci-results
